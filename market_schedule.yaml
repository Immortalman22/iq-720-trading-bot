# IQ Option Markets Schedule Configuration

# This file contains the trading schedule information for IQ Option markets
# Used by the market availability manager to determine when markets are open

# General trading hours
forex:
  regular:
    sunday_open: "22:00"   # UTC time, forex opens Sunday evening
    friday_close: "22:00"  # UTC time, forex closes Friday evening
    weekend: false         # Regular forex markets closed on weekends
    
  otc:
    sunday_open: "00:00"   # UTC time
    friday_close: "23:59"  # UTC time
    weekend: true          # OTC markets available on weekends
    weekend_open: "00:00"  # UTC time
    weekend_close: "23:59" # UTC time

# Market availability by pair
# Key is the asset pair, values are availability flags
pairs:
